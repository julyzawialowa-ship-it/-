name: inspect-current-site
on:
  push:
    paths:
      - '.github/workflows/inspect-current-site.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current index
        shell: python
        run: |
          import re, hashlib, base64, zlib, json
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          payloads = re.findall(r'base64,([A-Za-z0-9+/=]+)', s)
          print("IMAGE_HASHES=" + json.dumps([hashlib.sha256(x.encode()).hexdigest()[:16] for x in payloads]))
          norm = re.sub(r'base64,[A-Za-z0-9+/=]+', 'base64,<DATA>', s)
          packed = base64.b64encode(zlib.compress(norm.encode("utf-8"), 9)).decode("ascii")
          print("NORM_B64=" + packed)
